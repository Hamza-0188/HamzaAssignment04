name: PR Validation

on:
  pull_request:
    branches: [develop]

jobs:
  lint:
    name: Lint HTML and CSS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4  # Updated to v4

      - name: Set up Node.js
        uses: actions/setup-node@v4  # Updated to v4
        with:
          node-version: '20'  # Updated to LTS version

      - name: Install dependencies
        run: npm ci  # More reliable than npm install

      - name: Debug - List files
        run: |
          echo "Current directory: $(pwd)"
          ls -la
          echo "Stylelint config:"
          if [ -f .stylelintrc.json ]; then
            cat .stylelintrc.json
          else
            echo ".stylelintrc.json not found!"
          fi

      - name: Run HTMLHint
        run: npx htmlhint "src/*.html"  # Simplified pattern

      - name: Run Stylelint
        run: npx stylelint "styles/*.css" --config .stylelintrc.json  # Added config

  build:
    name: Build Website with Parcel
    runs-on: ubuntu-latest
    needs: lint  # Ensure build runs after lint

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Run Parcel build
        run: npx parcel build src/*.html --dist-dir dist  # Added output dir